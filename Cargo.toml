[package]
name = "stm32h7-rax"
version = "0.1.0"
edition = "2024"
description = "STM32H7 SoC emulator: rax's Cortex-M7 core with the memory map and the peripheral models"
license = "MIT OR Apache-2.0"
authors = ["Georges Palauqui <g.palauqui@gptechinno.com>"]
readme = "README.md"
keywords = ["stm32h7", "stm32", "emulator", "cortex-m"]
categories = ["emulators", "embedded", "simulation"]

[dependencies]
# rax with its Cortex-M additions not upstream yet, from the `feat/cortex-m7-fp-data` branch of the fork;
# a version replaces it once rax is on crates.io
rax = { git = "https://github.com/Georges760/rax", branch = "feat/cortex-m7-fp-data", default-features = false }
goblin = "0.10"
