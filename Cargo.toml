[package]
name = "stm32h7-rax"
version = "0.1.0"
edition = "2024"
description = "STM32H7 SoC emulator: rax's Cortex-M7 core with the memory map and the peripheral models"
license = "MIT OR Apache-2.0"
authors = ["Georges Palauqui <g.palauqui@gptechinno.com>"]
readme = "README.md"
keywords = ["stm32h7", "stm32", "emulator", "cortex-m"]
categories = ["emulators", "embedded", "simulation"]

[dependencies]
# rax with its Cortex-M7 additions, from a checkout of the `feat/cortex-m7` branch of
# https://github.com/Georges760/rax; a version goes next to the path once rax is on crates.io
rax = { path = "../../upstream/rax", default-features = false }
goblin = "0.10"
